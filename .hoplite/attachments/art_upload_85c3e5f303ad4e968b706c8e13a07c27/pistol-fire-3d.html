<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pistol Fire 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#08080a;--ink:#e9e6df;--chip:#1b1d22;--line:#2f323a;--hot:#ffb347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
button{font:600 17px/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:12px 18px;cursor:pointer;min-height:44px}
button:hover{border-color:#5a5f6b}
button[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
button.fire{background:#c8541b;border-color:#e8793c;color:#fff;padding:12px 30px}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));font-size:15px;opacity:.65;line-height:1.35;pointer-events:none}
.hud b{font-weight:600;font-size:19px}
</style>
</head>
<body>
<div class="hud"><b>Shots <span id="n">0</span></b><br>Click or Space to fire · G swaps weapon · drag to orbit · scroll to zoom</div>
<div class="bar">
  <button class="fire" id="bFire">Fire</button>
  <button id="bGun">Rifle</button>
  <button id="bAuto" aria-pressed="false">Auto fire</button>
  <button id="bSlow" aria-pressed="false">Slow motion</button>
  <button id="bMute" aria-pressed="false">Mute</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,R=Math.random,V=(x,y,z)=>new T.Vector3(x,y,z);
const ren=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.outputEncoding=T.sRGBEncoding;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;
ren.domElement.id='c';document.body.prepend(ren.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x08080a);scene.fog=new T.Fog(0x08080a,16,48);
const cam=new T.PerspectiveCamera(34,1,.1,100);

/* environment for reflections */
const pm=new T.PMREMGenerator(ren),es=new T.Scene();
es.add(new T.Mesh(new T.SphereGeometry(20,16,12),new T.MeshBasicMaterial({color:0x14161a,side:T.BackSide})));
[[0,12,0,16,.3,6,3.5,3.5,3.6],[-14,2,0,.3,6,14,2.2,2.2,2.4],[10,3,-12,10,5,.3,3.5,1.8,.7],[8,-2,14,.3,6,12,1.6,1.6,1.8]].forEach(([x,y,z,w,h,d,r,g,b])=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial());m.material.color.setRGB(r,g,b);m.position.set(x,y,z);es.add(m)});
scene.environment=pm.fromScene(es,.04).texture;
const key=new T.DirectionalLight(0xfff1e0,1.1);key.position.set(4,8,9);scene.add(key);
const rim=new T.DirectionalLight(0x7aa6ff,.8);rim.position.set(-6,4,-8);scene.add(rim);
scene.add(new T.HemisphereLight(0x889,0x110f0e,.25));
const flashL=new T.PointLight(0xff9a40,0,16,2);scene.add(flashL);

/* materials */
const M=(c,m,r)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const mMetal=M(0x2a2c30,.9,.32),mPoly=M(0x1d1e21,.2,.6),mGold=M(0xd2a446,1,.28),mWhite=M(0xe9e8e4,.15,.3),mBlack=M(0x0d0d0f,.3,.5);
const add=(p,geo,mat,x,y,z)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};
function cap(r,len,mat){const g=new T.Group(),s=new T.SphereGeometry(r,16,12);g.add(new T.Mesh(new T.CylinderGeometry(r,r,len,16),mat));add(g,s,mat,0,len/2,0);add(g,s,mat,0,-len/2,0);return g}

/* pistol */
const rig=new T.Group(),gunG=new T.Group(),slide=new T.Group();rig.add(gunG);gunG.add(slide);scene.add(rig);
add(slide,new T.BoxGeometry(2,.34,.26),mMetal,0,.2,0);
for(let i=0;i<6;i++)add(slide,new T.BoxGeometry(.025,.3,.28),mBlack,-.85+i*.07,.2,0);
add(slide,new T.BoxGeometry(.5,.1,.27),mBlack,.1,.3,0);
add(slide,new T.BoxGeometry(.1,.07,.05),mBlack,.95,.4,0);add(slide,new T.BoxGeometry(.12,.07,.12),mBlack,-.9,.4,0);
let b=add(gunG,new T.CylinderGeometry(.075,.075,.2,20),mMetal,1.06,.2,0);b.rotation.z=Math.PI/2;
b=add(gunG,new T.CylinderGeometry(.088,.088,.03,20),mGold,1.14,.2,0);b.rotation.z=Math.PI/2;
b=add(gunG,new T.CylinderGeometry(.05,.05,.035,16),mBlack,1.155,.2,0);b.rotation.z=Math.PI/2;
add(gunG,new T.BoxGeometry(1.75,.2,.22),mPoly,-.12,0,0);
b=add(gunG,new T.BoxGeometry(.46,1.05,.24),mPoly,-.5,-.58,0);b.rotation.z=-.2;
b=add(gunG,new T.TorusGeometry(.2,.032,8,20,Math.PI),mPoly,.42,-.1,0);b.rotation.z=Math.PI;
add(gunG,new T.BoxGeometry(.045,.2,.05),mGold,.38,-.13,0);
/* robotic hand */
add(rig,new T.SphereGeometry(1,28,18),mWhite,-.78,-.62,.02).scale.set(.42,.7,.34);
for(let i=0;i<4;i++){const y=-.3-i*.2,f=cap(.095,.62,mWhite);f.rotation.x=Math.PI/2;f.position.set(-.24+(y+.55)*.2+.07,y,.07);rig.add(f)}
const th=cap(.09,.9,mWhite);th.rotation.z=Math.PI/2;th.position.set(-.2,.0,.2);rig.add(th);
const arm=new T.Group();arm.position.set(-2.42,-1.54,0);arm.rotation.z=1.98;rig.add(arm);
add(arm,new T.CylinderGeometry(.34,.4,3.2,28),mWhite,0,0,0);add(arm,new T.CylinderGeometry(.42,.42,.24,28),mBlack,0,-1.15,0);
/* rifle with two arms */
const rRig=new T.Group(),rGun=new T.Group(),rBolt=new T.Group();rRig.add(rGun);rGun.add(rBolt);scene.add(rRig);rRig.visible=false;
add(rGun,new T.BoxGeometry(2.2,.45,.32),mPoly,0,0,0);
add(rGun,new T.BoxGeometry(2.7,.42,.34),mMetal,.25,.43,0);
add(rGun,new T.BoxGeometry(.45,.16,.02),mBlack,.7,.5,.175);
let rb=add(rGun,new T.CylinderGeometry(.27,.27,2.4,24),mPoly,2.55,.43,0);rb.rotation.z=Math.PI/2;
add(rGun,new T.BoxGeometry(2.4,.06,.2),mMetal,2.55,.72,0);
rb=add(rGun,new T.CylinderGeometry(.07,.07,2.0,16),mMetal,4.7,.43,0);rb.rotation.z=Math.PI/2;
add(rGun,new T.BoxGeometry(.22,.3,.16),mMetal,3.9,.62,0);
rb=add(rGun,new T.CylinderGeometry(.11,.1,.45,16),mBlack,5.75,.43,0);rb.rotation.z=Math.PI/2;
for(let i=0;i<3;i++)add(rGun,new T.BoxGeometry(.05,.24,.2),mMetal,5.62+i*.12,.43,0);
rb=add(rGun,new T.CylinderGeometry(.14,.14,1.3,16),mMetal,-1.8,.4,0);rb.rotation.z=Math.PI/2;
add(rGun,new T.BoxGeometry(1.3,.6,.3),mPoly,-2.6,.25,0);add(rGun,new T.BoxGeometry(.1,.75,.32),mBlack,-3.28,.2,0);
rb=add(rGun,new T.BoxGeometry(.34,.95,.26),mPoly,-.35,-.65,0);rb.rotation.z=-.25;
rb=add(rGun,new T.BoxGeometry(.42,1.05,.26),mPoly,.8,-.72,0);rb.rotation.z=.18;
rb=add(rGun,new T.TorusGeometry(.2,.03,8,20,Math.PI),mPoly,.28,-.22,0);rb.rotation.z=Math.PI;
add(rGun,new T.BoxGeometry(.55,.3,.28),mBlack,.6,.86,0);add(rGun,new T.BoxGeometry(.04,.22,.2),mGold,.88,.86,0);
add(rBolt,new T.BoxGeometry(.3,.1,.22),mMetal,-.95,.68,0);add(rBolt,new T.BoxGeometry(.32,.08,.03),mGold,.6,.5,.19);
/* right hand on pistol grip */
add(rRig,new T.SphereGeometry(1,28,18),mWhite,-.58,-.62,.02).scale.set(.38,.62,.32);
for(let i=0;i<4;i++){const y=-.35-i*.2,f=cap(.09,.6,mWhite);f.rotation.x=Math.PI/2;f.position.set(-.18+(y+.65)*.25+.07,y,.07);rRig.add(f)}
let rt=cap(.085,.7,mWhite);rt.rotation.z=Math.PI/2;rt.position.set(-.2,-.05,.2);rRig.add(rt);
let ra=new T.Group();ra.position.set(-2.17,-1.49,0);ra.rotation.z=1.98;rRig.add(ra);
add(ra,new T.CylinderGeometry(.32,.38,3.2,28),mWhite,0,0,0);add(ra,new T.CylinderGeometry(.4,.4,.24,28),mBlack,0,-1.15,0);
/* left hand on handguard */
add(rRig,new T.SphereGeometry(1,28,18),mWhite,2.55,.05,.12).scale.set(.6,.3,.3);
for(let i=0;i<4;i++){const f=cap(.085,.5,mWhite);f.position.set(2.0+i*.2,.33,.3);rRig.add(f)}
rt=cap(.08,.55,mWhite);rt.rotation.z=Math.PI/2;rt.position.set(2.45,.76,.12);rRig.add(rt);
let la=new T.Group();la.position.set(1.17,-1.23,.42);la.rotation.z=2.356;rRig.add(la);
add(la,new T.CylinderGeometry(.3,.36,3.2,28),mWhite,0,0,0);add(la,new T.CylinderGeometry(.38,.38,.24,28),mBlack,0,-1.15,0);
const PIS={rig,gunG,slide,mz:V(1.17,.2,0),port:V(.1,.3,.14),rec:1,sl:.3,big:1,rad:1,tgt:V(1.4,-.3,0),rate:.55};
const RIF={rig:rRig,gunG:rGun,slide:rBolt,mz:V(6.0,.43,0),port:V(.7,.5,.2),rec:.55,sl:.45,big:1.3,rad:1.55,tgt:V(2.1,-.3,0),rate:.3};
let cur=PIS;
/* floor */
const fl=new T.Mesh(new T.PlaneGeometry(80,80),M(0x141416,.2,.55));fl.rotation.x=-Math.PI/2;fl.position.y=-3.4;scene.add(fl);

function pose(r,s){const c=cur,k=c.rec;c.rig.position.set(-r*.1*k,r*.02*k,0);c.rig.rotation.z=r*.04*k;c.gunG.position.x=-r*.14*k;c.gunG.rotation.z=r*.07*k;c.slide.position.x=-s*c.sl}

/* volumetric raymarched fire + smoke */
const VOL_VS='varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const COMMON=`precision highp float;varying vec3 vP;uniform vec3 uRo,uB0,uB1;uniform float uAge,uT,uSeed,uGain;
float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1.,0.,0.)),f.x),mix(h3(i+vec3(0.,1.,0.)),h3(i+vec3(1.,1.,0.)),f.x),f.y),
            mix(mix(h3(i+vec3(0.,0.,1.)),h3(i+vec3(1.,0.,1.)),f.x),mix(h3(i+vec3(0.,1.,1.)),h3(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return v;}
float cone(vec2 q,float ang,float len,float wid){len=max(len,.001);float c=cos(ang),s=sin(ang);vec2 r=vec2(c*q.x+s*q.y,-s*q.x+c*q.y);float t=r.x/len;if(t<=0.||t>=1.)return 0.;float hw=wid*pow(sin(3.14159*pow(t,.55)),.9)+.001;return clamp(1.-abs(r.y)/hw,0.,1.);}
bool bx(vec3 ro,vec3 rd,out float t0,out float t1){vec3 a=(uB0-ro)/rd,b=(uB1-ro)/rd,mn=min(a,b),mx=max(a,b);t0=max(max(mn.x,mn.y),max(mn.z,0.));t1=min(min(mx.x,mx.y),mx.z);return t1>t0;}`;
const FIRE=COMMON+`
void main(){
 vec3 ro=uRo,rd=normalize(vP-ro);float t0,t1;if(!bx(ro,rd,t0,t1))discard;
 const int N=30;float dt=(t1-t0)/float(N),t=t0+dt*h3(vec3(gl_FragCoord.xy,uT*60.));
 float a=uAge,grow=1.-pow(1.-clamp(a*9.,0.,1.),3.),I=pow(1.-smoothstep(.35,1.6,a),1.5),tt=uT*5.+uSeed,L=4.1*grow*(1.+.08*min(a,1.6));
 vec3 acc=vec3(0.);float k1=fract(sin(uSeed*12.9898)*43758.5453),k2=fract(sin(uSeed*78.233)*12345.6789),k3=fract(sin(uSeed*39.346)*24634.6345),k4=fract(sin(uSeed*11.135)*53758.1234);
 for(int i=0;i<N;i++){
  vec3 p=ro+rd*t;t+=dt;
  float x=p.x,r=length(p.yz);
  if(x<-.1||x>5.2||r>2.3)continue;
  float ph=atan(p.z,p.y);
  float nw=fbm3(p*1.5+vec3(-tt*.5,uSeed,3.)),m=smoothstep(0.,1.2,length(vec2(x,r)));
  vec2 q=vec2(x+(nw-.5)*.7*m,abs(r+(nw-.5)*.6*m));
  float tongue=cone(q,(k4-.5)*.18,L*(.85+.35*k1),.56+.2*k4);
  float blob=clamp(1.-length((q-vec2(.85*grow,0.))*vec2(.95,1.))/((.85+.25*k3)*grow+.001),0.,1.);
  float petal=.3+.7*pow(.5+.5*cos((3.+floor(k2*4.))*ph+uSeed*3.+nw*3.),2.);
  float sp=cone(q-vec2(.15,.1),.62+.34*k2,(1.7+.9*k3)*grow,.4+.14*k1)*petal;
  float b=pow(max(max(tongue,blob),sp),.55),e=b*(1.-b)*4.;
  float n=fbm3(p*3.4+vec3(-tt*1.1,uSeed*3.,0.)),n2=vn3(p*12.+vec3(-tt*2.,uSeed*5.,0.));
  float reach=smoothstep(0.,.25,b);
  float d=clamp(b*1.5+(n-.5)*reach*(.5+(1.-b)*.9)+(n2-.5)*.6*e-.1-a*.12,0.,1.)*reach*smoothstep(-.02,.18,x);
  float T=d*(1.-.5*min(a,1.6))+.6*exp(-length(vec2(x*.8,r*1.4))*1.2)*max(1.-a,0.);
  T*=1.-.4*smoothstep(1.6,4.2,x);
  vec3 col=vec3(.45,.05,.01);
  col=mix(col,vec3(1.,.32,.04),smoothstep(.12,.4,T));
  col=mix(col,vec3(1.,.66,.12),smoothstep(.35,.65,T));
  col=mix(col,vec3(1.,.93,.62),smoothstep(.6,.95,T));
  col=mix(col,vec3(1.,1.,.97),smoothstep(.95,1.4,T));
  acc+=col*d*dt*1.1;
 }
 gl_FragColor=vec4(acc*I*uGain,1.);
}`;
const SMOKE=COMMON+`
void main(){
 vec3 ro=uRo,rd=normalize(vP-ro);float t0,t1;if(!bx(ro,rd,t0,t1))discard;
 const int N=30;float dt=(t1-t0)/float(N),t=t0+dt*h3(vec3(gl_FragCoord.xy,uT*60.));
 float sa=uAge,ex=1.-exp(-sa*4.5),c=.9+2.*ex+.15*sa,rx=1.+2.*ex+.2*sa,ry=.8+1.1*ex+.14*sa;
 float fade=smoothstep(0.,.06,sa)*(1.-smoothstep(.6,2.4,sa)),warm=1.-smoothstep(0.,.45,sa);
 vec3 C=vec3(0.);float Tr=1.;
 for(int i=0;i<N;i++){
  vec3 p=ro+rd*t;t+=dt;
  float x=p.x,r=length(p.yz);
  float nw=fbm3(p*1.2+vec3(uSeed,-sa*.4,1.));
  float env=1.-length(vec2((x-c)/rx,r/ry))+(nw-.5)*.9;
  if(env<-.5)continue;
  float sn=fbm3(p*2.6+vec3(-sa*.5,uSeed,0.));
  float d=smoothstep(0.,.55,env+(sn-.5)*.7)*fade*2.2;
  float al=1.-exp(-d*dt);
  vec3 lc=vec3(.62,.58,.55)*(.5+.5*sn)+vec3(.12,.12,.14)*clamp(p.y*.4+.5,0.,1.)+vec3(1.,.5,.15)*exp(-length(p-vec3(.8,0.,0.))*.6)*warm*1.4;
  C+=Tr*al*lc;Tr*=1.-al;
 }
 gl_FragColor=vec4(C,1.-Tr);
}`;
const FIREB=[V(-.6,-2.3,-2.3),V(5.4,2.3,2.3)],SMKB=[V(-1,-3.3,-3.3),V(8.5,3.3,3.3)];
function volMat(frag,B,blend){const m=new T.ShaderMaterial({vertexShader:VOL_VS,fragmentShader:frag,uniforms:{uRo:{value:V(0,0,0)},uB0:{value:B[0]},uB1:{value:B[1]},uAge:{value:2},uT:{value:0},uSeed:{value:0},uGain:{value:1}},transparent:true,depthWrite:false,side:T.BackSide});
  if(blend){m.blending=T.CustomBlending;m.blendEquation=T.AddEquation;m.blendSrc=T.OneFactor;m.blendDst=T.OneMinusSrcAlphaFactor}else m.blending=T.AdditiveBlending;return m}
function volMesh(B,mat,order){const sz=B[1].clone().sub(B[0]),c=B[1].clone().add(B[0]).multiplyScalar(.5),g=new T.BoxGeometry(sz.x,sz.y,sz.z);g.translate(c.x,c.y,c.z);const m=new T.Mesh(g,mat);m.renderOrder=order;m.frustumCulled=false;return m}
const fires=[];
for(let k=0;k<8;k++){const g=new T.Group();g.visible=false;g.userData={age:9};
  const fm=volMesh(FIREB,volMat(FIRE,FIREB,false),2),sm=volMesh(SMKB,volMat(SMOKE,SMKB,true),1);
  g.add(sm,fm);g.userData.f=fm;g.userData.s=sm;scene.add(g);fires.push(g)}
let fi=0;
/* glow sprite */
const gc=document.createElement('canvas');gc.width=gc.height=128;const gx2=gc.getContext('2d'),gg=gx2.createRadialGradient(64,64,0,64,64,64);
gg.addColorStop(0,'rgba(255,230,170,1)');gg.addColorStop(.3,'rgba(255,150,50,.5)');gg.addColorStop(1,'rgba(255,90,0,0)');gx2.fillStyle=gg;gx2.fillRect(0,0,128,128);
const glowS=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(gc),blending:T.AdditiveBlending,depthWrite:false,transparent:true,opacity:0}));scene.add(glowS);
/* embers */
const NE=70,ePos=new Float32Array(NE*6),eCol=new Float32Array(NE*6),emb=[];
for(let i=0;i<NE;i++)emb.push({p:V(0,-99,0),v:V(0,0,0),age:9,life:1});
const eg=new T.BufferGeometry();eg.setAttribute('position',new T.BufferAttribute(ePos,3));eg.setAttribute('color',new T.BufferAttribute(eCol,3));
const eLines=new T.LineSegments(eg,new T.LineBasicMaterial({vertexColors:true,blending:T.AdditiveBlending,transparent:true,depthWrite:false}));eLines.frustumCulled=false;scene.add(eLines);
let ei=0;
/* bullet + casings */
const bullets=[],cases=[];
const bGeo=new T.CylinderGeometry(.04,.04,.22,10);bGeo.rotateZ(Math.PI/2);
const tGeo=new T.CylinderGeometry(.012,.03,1,8);tGeo.rotateZ(-Math.PI/2);tGeo.translate(-.5,0,0);
const cGeo=new T.CylinderGeometry(.045,.045,.18,12);

/* audio */
let ac,muted=false;
function boom(){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,len=ac.sampleRate*.7,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,3);
  const n=ac.createBufferSource();n.buffer=buf;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(5200,t);lp.frequency.exponentialRampToValueAtTime(350,t+.35);
  const g=ac.createGain();g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);n.connect(lp).connect(g).connect(ac.destination);n.start(t);
  const o=ac.createOscillator(),og=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(38,t+.2);og.gain.setValueAtTime(.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(og).connect(ac.destination);o.start(t);o.stop(t+.35)}catch(e){}}

/* state */
let recoil=0,sl=0,shake=0,glow=0,shots=0,slow=false,auto=false,autoT=0,simT=0,curDir=V(1,0,0),curMz=V(1.2,.2,0);
function trigger(){window.dispatchEvent(new CustomEvent('pistol:fire',{detail:{time:performance.now()}}))}
window.firePistol=trigger;
window.addEventListener('pistol:fire',()=>{
  shots++;document.getElementById('n').textContent=shots;
  pose(0,0);cur.rig.updateMatrixWorld(true);
  const mz=cur.gunG.localToWorld(cur.mz.clone()),q=cur.gunG.getWorldQuaternion(new T.Quaternion()),dir=V(1,0,0).applyQuaternion(q);
  curDir=dir.clone();curMz=mz.clone();
  recoil=1;sl=1;shake=1;glow=1;pose(1,1);cur.rig.updateMatrixWorld(true);
  const g=fires[fi++%8];g.position.copy(mz);g.quaternion.copy(q);g.scale.setScalar(cur.big);g.userData.age=.012;g.visible=true;g.userData.f.visible=true;const sd=R()*20;[g.userData.f,g.userData.s].forEach(o=>o.material.uniforms.uSeed.value=sd);
  for(let i=0;i<NE*.6;i++){const e=emb[ei++%NE],sp=(R()<.7?.5:1.2),v=dir.clone().add(V((R()-.5)*sp,(R()-.5)*sp,(R()-.5)*sp)).normalize().multiplyScalar(4+Math.pow(R(),2)*24);
    e.p.copy(mz).addScaledVector(dir,R()*.8);e.v.copy(v);e.age=0;e.life=.3+R()*.9}
  const bl=new T.Mesh(bGeo,mGold),tr=new T.Mesh(tGeo,new T.MeshBasicMaterial({color:0xffd9a0,blending:T.AdditiveBlending,transparent:true,opacity:.6,depthWrite:false}));
  bl.quaternion.copy(q);tr.quaternion.copy(q);bl.position.copy(mz);tr.position.copy(mz);scene.add(bl,tr);bullets.push({bl,tr,dir:dir.clone(),d:0,age:0});
  const cs=new T.Mesh(cGeo,mGold);cs.position.copy(cur.slide.localToWorld(cur.port.clone()));scene.add(cs);
  cases.push({m:cs,v:V(-1+R()*.6,4+R()*2,2.2+R()*1.6),w:V(R()*20,R()*20,R()*20),rest:false});
  boom();
});

/* camera + input */
let th0=.4,ph=1.38,zoom=1,drag=null;
const el=ren.domElement;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});
el.addEventListener('pointermove',e=>{if(!drag)return;th0-=(e.clientX-drag.x)*.006;ph=Math.min(1.9,Math.max(.6,ph-(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});
el.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)trigger();drag=null;el.style.cursor='grab'});
el.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.8,Math.max(.45,zoom*(1+e.deltaY*.001)))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const tgt=V(1.4,-.3,0);

let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;if(slow)dt*=.15;simT+=dt;
  if(auto){autoT-=dt/(slow?.15:1);if(autoT<=0){autoT=cur.rate;trigger()}}
  recoil=Math.max(0,recoil-dt*(recoil>.5?5:3.2));sl=Math.max(0,sl-dt*8);shake=Math.max(0,shake-dt*7);glow=Math.max(0,glow-dt*9);
  pose(recoil*recoil,sl);
  fires.forEach(g=>{if(!g.visible)return;const u=g.userData;u.age+=dt;if(u.age>2.4){g.visible=false;return}const a=u.age/.14;u.f.visible=a<1.6;u.f.material.uniforms.uAge.value=a;u.f.material.uniforms.uT.value=simT;u.s.material.uniforms.uAge.value=u.age;u.s.material.uniforms.uT.value=simT});
  flashL.position.copy(curMz).addScaledVector(curDir,1);flashL.intensity=glow*glow*90;
  glowS.position.copy(curMz).addScaledVector(curDir,.9);glowS.scale.setScalar(4+3*glow);glowS.material.opacity=Math.min(.4,glow*.5);
  
  for(let i=0;i<NE;i++){const e=emb[i],o=i*6;
    if(e.age<e.life){e.age+=dt;e.v.y-=7*dt;e.v.multiplyScalar(Math.pow(.3,dt));e.p.addScaledVector(e.v,dt);const p=Math.max(0,1-e.age/e.life)*(.6+.4*R());
      ePos[o]=e.p.x;ePos[o+1]=e.p.y;ePos[o+2]=e.p.z;ePos[o+3]=e.p.x-e.v.x*.04;ePos[o+4]=e.p.y-e.v.y*.04;ePos[o+5]=e.p.z-e.v.z*.04;
      eCol[o]=p;eCol[o+1]=.78*p;eCol[o+2]=.35*p;eCol[o+3]=.5*p;eCol[o+4]=.14*p;eCol[o+5]=0}
    else{ePos[o+1]=ePos[o+4]=-99;eCol[o]=eCol[o+1]=eCol[o+2]=eCol[o+3]=eCol[o+4]=eCol[o+5]=0}}
  eg.attributes.position.needsUpdate=eg.attributes.color.needsUpdate=true;
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.age+=dt;if(b.age<0){b.bl.visible=b.tr.visible=false;continue}b.bl.visible=b.tr.visible=true;
    b.d+=90*dt;b.bl.position.copy(curMz).addScaledVector(b.dir,b.d);b.tr.position.copy(b.bl.position);b.tr.scale.x=Math.min(b.d,4);
    if(b.d>70){scene.remove(b.bl,b.tr);bullets.splice(i,1)}}
  cases.forEach(c=>{if(c.rest)return;c.v.y-=16*dt;c.m.position.addScaledVector(c.v,dt);c.m.rotation.x+=c.w.x*dt;c.m.rotation.y+=c.w.y*dt;c.m.rotation.z+=c.w.z*dt;
    if(c.m.position.y<-3.3){c.m.position.y=-3.3;c.v.y*=-.35;c.v.x*=.6;c.v.z*=.6;c.w.multiplyScalar(.5);if(Math.abs(c.v.y)<.8){c.rest=true}}});
  tgt.lerp(cur.tgt,.07);const asp=cam.aspect,rad=12*cur.rad*(asp<1?1.7:1)*zoom,sh=shake*shake*.12;
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th0)+(R()-.5)*sh,tgt.y+rad*Math.cos(ph)+(R()-.5)*sh,tgt.z+rad*Math.sin(ph)*Math.cos(th0));cam.lookAt(tgt);cam.updateMatrixWorld();fires.forEach(g=>{if(!g.visible)return;g.updateMatrixWorld(true);const lc=g.worldToLocal(cam.position.clone());g.userData.f.material.uniforms.uRo.value.copy(lc);g.userData.s.material.uniforms.uRo.value.copy(lc)});
  ren.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const bFire=document.getElementById('bFire'),bAuto=document.getElementById('bAuto'),bSlow=document.getElementById('bSlow'),bMute=document.getElementById('bMute');
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();trigger()}if(e.key==='s')bSlow.click();if(e.key==='a')bAuto.click()});
bFire.onclick=e=>{e.currentTarget.blur();trigger()};
bAuto.onclick=()=>{auto=!auto;bAuto.setAttribute('aria-pressed',auto);autoT=0};
bSlow.onclick=()=>{slow=!slow;bSlow.setAttribute('aria-pressed',slow)};
bMute.onclick=()=>{muted=!muted;bMute.setAttribute('aria-pressed',muted)};
const bGun=document.getElementById('bGun');
function swap(){cur.rig.visible=false;cur=cur===PIS?RIF:PIS;cur.rig.visible=true;recoil=0;sl=0;pose(0,0);bGun.textContent=cur===PIS?'Rifle':'Pistol';autoT=0}
bGun.onclick=e=>{e.currentTarget.blur();swap();setTimeout(trigger,250)};
addEventListener('keydown',e=>{if(e.key==='g')bGun.click()});
setTimeout(trigger,600);
})();
</script>
