<!doctype html><html><body style="margin:0"><pre id="out" style="position:fixed;color:#fff;font-size:10px;max-width:100%;white-space:pre-wrap">loading</pre>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.186.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.onerror = (m) => { document.getElementById('out').textContent = 'ERR ' + m; };
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30343a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(1, 2, 1); scene.add(d);
const g = await new GLTFLoader().loadAsync(q.get('f'));
const root = g.scene; scene.add(root);
const by = {}; root.traverse(o => by[o.name] = o);
const hide = (q.get('hide') || '').split(',').filter(Boolean); hide.forEach(n => by[n] && (by[n].visible = false));
const mixer = new THREE.AnimationMixer(root);
const clip = g.animations.find(a => a.name === q.get('a'));
if (clip) { mixer.clipAction(clip).play(); mixer.setTime(+q.get('t') || 0); }
root.updateMatrixWorld(true);
const W = by[q.get('w')];
const wp = new THREE.Vector3().setFromMatrixPosition(W.matrixWorld);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const c = (q.get('cam') || '1,0,0').split(',').map(Number);
// camera offset in weapon local axes (meters)
const wq = new THREE.Quaternion(); W.matrixWorld.decompose(new THREE.Vector3(), wq, new THREE.Vector3());
const tgt = wp.clone().add(new THREE.Vector3(...(q.get('tg') || '0,0,0').split(',').map(Number)).applyQuaternion(wq));
cam.position.copy(tgt).add(new THREE.Vector3(...c).applyQuaternion(wq)); cam.up.set(0,1,0).applyQuaternion(wq); cam.lookAt(tgt);
r.render(scene, cam);
// local-space boxes of meshes
const inv = W.matrixWorld.clone().invert(), out = {};
root.traverse(o => { if (o.isMesh && o.visible) { const b = new THREE.Box3(); o.geometry.computeBoundingBox(); b.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld).applyMatrix4(inv); out[o.name] = [b.min.toArray().map(x=>+x.toFixed(1)), b.max.toArray().map(x=>+x.toFixed(1))]; } });
document.getElementById('out').textContent = JSON.stringify(out);
</script></body></html>
