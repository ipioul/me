<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mannequin – Shooting Stance & Fire</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; font-family: system-ui, sans-serif; color: #e6e6e6; }
  #app { position: fixed; inset: 0; }
  #ui { position: fixed; top: 12px; left: 12px; right: 250px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  #ui button { background: #2b3038; color: #e6e6e6; border: 1px solid #444b55; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  #ui button:hover, #ui button.active { background: #3d6fb6; border-color: #3d6fb6; }
  #ui button.fire { background: #a8322a; border-color: #c4473e; font-weight: 600; }
  #ui .sep { width: 1px; background: #444b55; margin: 0 4px; }
  #ref { position: fixed; right: 12px; bottom: 12px; width: 220px; border: 2px solid #444b55; border-radius: 6px; z-index: 2; }
  #ref.hidden { display: none; }
  #status { position: fixed; left: 12px; bottom: 12px; font-size: 12px; opacity: .7; z-index: 2; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <button data-view="photo" class="active">Photo view</button>
  <button data-view="front">Front</button>
  <button data-view="left">Left</button>
  <button data-view="right">Right</button>
  <button data-view="back">Back</button>
  <button data-view="gripL">Grip L</button>
  <button data-view="gripR">Grip R</button>
  <button data-view="shoulder">Over shoulder</button>
  <span class="sep"></span>
  <button id="fire" class="fire">Fire (Space)</button>
  <button id="auto">Auto fire</button>
  <button id="slow">Slow-mo</button>
  <button id="sound" class="active">Sound</button>
  <button id="colliders">Colliders</button>
  <span class="sep"></span>
  <button id="spin">Auto-rotate</button>
  <button id="toggleRef">Reference</button>
</div>
<img id="ref" src="assets/reference.png" alt="Reference pose">
<div id="status">Loading mannequin…</div>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const DEG = Math.PI / 180;
const params = new URLSearchParams(location.search);

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e23);
scene.fog = new THREE.Fog(0x1b1e23, 600, 1400);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 95, 10);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3f47, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(180, 380, 220);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 250, bottom: -100, near: 10, far: 1000 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fc3ff, 1.0);
rim.position.set(-250, 200, -250);
scene.add(rim);

const GROUND_Y = 0;
const ground = new THREE.Mesh(new THREE.CircleGeometry(800, 64),
  new THREE.MeshStandardMaterial({ color: 0x5d7a80, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(800, 40, 0x7f9aa0, 0x6a8890);
grid.position.y = 0.05;
grid.material.opacity = 0.35; grid.material.transparent = true;
scene.add(grid);

// ---------- bone helpers (all targets are in world space) ----------
const bones = {};
const restWorldQ = {};
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();

function worldPos(b) { b.updateWorldMatrix(true, false); return b.getWorldPosition(new THREE.Vector3()); }
function worldQuat(b) { b.updateWorldMatrix(true, false); return b.getWorldQuaternion(new THREE.Quaternion()); }
function setWorldQuat(b, q) {
  const parentQ = worldQuat(b.parent);
  b.quaternion.copy(parentQ.invert().multiply(q));
  b.updateMatrixWorld(true);
}
function rotateWorld(b, axis, angle) {
  setWorldQuat(b, _q.setFromAxisAngle(axis.clone().normalize(), angle).multiply(worldQuat(b)));
}
// Orient a bone from rest so (child - bone) points along dir and refRest maps toward refTarget.
function orient(b, child, dir, refRest, refTarget) {
  setWorldQuat(b, restWorldQ[b.name].clone());
  const cur = worldPos(child).sub(worldPos(b)).normalize();
  const m1 = basis(cur, refRest), m2 = basis(dir.clone().normalize(), refTarget);
  const rot = new THREE.Quaternion().setFromRotationMatrix(m2.multiply(m1.transpose()));
  setWorldQuat(b, rot.multiply(worldQuat(b)));
}
function basis(a, ref) {
  const x = a.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, ref).normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  return new THREE.Matrix4().makeBasis(x, y, z);
}
function aimAt(b, child, target) {
  const cur = worldPos(child).sub(worldPos(b)).normalize();
  const want = target.clone().sub(worldPos(b)).normalize();
  setWorldQuat(b, _q2.setFromUnitVectors(cur, want).multiply(worldQuat(b)));
}
function twoBoneIK(root, mid, end, target, pole) {
  const a = worldPos(mid).distanceTo(worldPos(root));
  const c = worldPos(end).distanceTo(worldPos(mid));
  const R = worldPos(root);
  const toT = target.clone().sub(R);
  const d = Math.min(toT.length(), (a + c) * 0.999);
  const dir = toT.normalize();
  const cosA = (a * a + d * d - c * c) / (2 * a * d);
  const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
  const perp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const elbow = R.clone().add(dir.clone().multiplyScalar(a * cosA)).add(perp.multiplyScalar(a * sinA));
  aimAt(root, mid, elbow);
  aimAt(mid, end, R.clone().add(dir.multiplyScalar(d)));
}

// ======================================================================
//  PISTOL — one side profile drives both the mesh and the collision SDF
//  Gun space: +Z muzzle, +Y up, +X = gun's left side, units cm.
// ======================================================================
const FRAME_OUT = [[-1.0, 0.5], [15.0, 0.5], [15.0, -0.9], [8.7, -0.9], [8.45, -2.8], [7.75, -3.45], [4.6, -3.45],
  [3.55, -3.0], [0.47, -11.46], [0.65, -11.5], [0.5, -12.05], [-4.55, -10.2], [-4.5, -9.62], [-4.32, -9.72],
  [-1.62, -2.3], [-2.45, -1.15], [-2.35, -0.35], [-1.6, 0.3]];
const FRAME_HOLE = [[4.85, -0.9], [8.05, -0.9], [7.85, -2.45], [7.35, -2.95], [4.75, -2.95], [4.2, -2.3]];
const TRIGGER = [[6.0, -0.9], [6.4, -0.9], [6.25, -1.7], [5.95, -2.55], [5.55, -2.55], [5.75, -1.7]];
const TRIGGER_PIVOT = [6.2, -0.9];
const TRIGGER_PULL = 18 * DEG;
const SLIDE_OUT = [[-2.0, 0.5], [16.4, 0.5], [16.4, 2.9], [15.9, 3.3], [-1.6, 3.3], [-2.0, 2.9]];
const FRAME_HW = 1.45, SLIDE_HW = 1.27, BEVEL = 0.2;
const MUZZLE = V(0, 1.9, 16.45), EJECT_PORT = V(-0.7, 3.2, 5.6);
const SLIDE_TRAVEL = 4.2;
const GUN_S = 1.15;   // the UE mannequin's hands are ~15% larger than a real hand

function sdPoly(px, py, pts) {
  let d = (px - pts[0][0]) ** 2 + (py - pts[0][1]) ** 2, s = 1;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const ex = pts[j][0] - pts[i][0], ey = pts[j][1] - pts[i][1];
    const wx = px - pts[i][0], wy = py - pts[i][1];
    const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
    const bx = wx - ex * t, by = wy - ey * t;
    d = Math.min(d, bx * bx + by * by);
    const c1 = py >= pts[i][1], c2 = py < pts[j][1], c3 = ex * wy > ey * wx;
    if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
  }
  return s * Math.sqrt(d);
}
function sdExtrude(d2, x, hw) {
  const wx = d2, wy = Math.abs(x) - hw;
  return Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx, 0), Math.max(wy, 0));
}
// Signed distance (cm) from a gun-space point to the pistol surface.
function gunSDF(p) {
  const frame = sdExtrude(Math.max(sdPoly(p.z, p.y, FRAME_OUT), -sdPoly(p.z, p.y, FRAME_HOLE)) - BEVEL, p.x, FRAME_HW);
  const slide = sdExtrude(sdPoly(p.z, p.y, SLIDE_OUT) - BEVEL, p.x, SLIDE_HW);
  const trig = sdExtrude(sdPoly(p.z, p.y, TRIGGER), p.x, 0.35);
  return Math.min(frame, slide, trig);
}

function extrudeSide(outline, holes, width, bevel, mat) {
  const s = new THREE.Shape(outline.map(([z, y]) => new THREE.Vector2(z, y)));
  (holes || []).forEach(h => s.holes.push(new THREE.Path(h.map(([z, y]) => new THREE.Vector2(z, y)))));
  const depth = width - 2 * bevel;
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 4 });
  g.rotateY(-Math.PI / 2); g.translate(depth / 2, 0, 0);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; return m;
}

function makePistol() {
  const polymer = new THREE.MeshStandardMaterial({ color: 0x202226, roughness: 0.78, metalness: 0.0 });
  const steel = new THREE.MeshStandardMaterial({ color: 0x2b2d31, roughness: 0.32, metalness: 0.85 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x0a0a0b, roughness: 0.6, metalness: 0.3 });
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x55585c, roughness: 0.25, metalness: 1.0 });

  const gun = new THREE.Group();
  gun.matrixAutoUpdate = false;
  gun.add(extrudeSide(FRAME_OUT, [FRAME_HOLE], FRAME_HW * 2, BEVEL, polymer));
  // grip texture panels
  for (const sx of [-1, 1]) {
    const p = box(0.05, 5.2, 3.6, dark, sx * (FRAME_HW + 0.01), -6.6, -0.7);
    p.rotation.x = 20 * DEG; gun.add(p);
  }
  // slide + details (moves as a unit)
  const slide = new THREE.Group();
  slide.add(extrudeSide(SLIDE_OUT, null, SLIDE_HW * 2, BEVEL, steel));
  slide.add(box(0.5, 0.55, 0.6, steel, 0, 3.55, 15.2));               // front sight
  slide.add(box(2.0, 0.6, 0.7, steel, 0, 3.58, -0.9));                // rear sight
  slide.add(box(0.5, 0.1, 0.1, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, 3.8, 15.5));
  for (let i = 0; i < 8; i++) for (const sx of [-1, 1])                 // rear serrations
    slide.add(box(0.06, 2.2, 0.18, dark, sx * (SLIDE_HW + 0.02), 1.95, -1.3 + i * 0.42));
  slide.add(box(1.5, 0.08, 3.6, dark, -0.35, 3.31, 5.6));             // ejection port
  slide.add(box(1.2, 0.1, 3.2, barrelMat, -0.35, 3.24, 5.6));          // barrel hood
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.1, 20), dark);
  crown.rotation.x = Math.PI / 2; crown.position.set(0, 1.9, 16.62); slide.add(crown);
  gun.add(slide);
  // trigger on its pivot
  const trigPivot = new THREE.Group();
  trigPivot.position.set(0, TRIGGER_PIVOT[1], TRIGGER_PIVOT[0]);
  const trig = extrudeSide(TRIGGER, null, 0.7, 0.08, polymer);
  trig.position.set(0, -TRIGGER_PIVOT[1], -TRIGGER_PIVOT[0]);
  trigPivot.add(trig); gun.add(trigPivot);
  gun.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { gun, slide, trigPivot };
}

// ======================================================================
//  COLLISION — capsules for fingers/palm, SDF for the pistol
// ======================================================================
const gunState = { mat: new THREE.Matrix4(), inv: new THREE.Matrix4(), q: new THREE.Quaternion() };
function setGunMatrix(m) {
  gunState.mat.copy(m); gunState.inv.copy(m).invert();
  const p = new THREE.Vector3(), s = new THREE.Vector3(); m.decompose(p, gunState.q, s);
}
const toGun = p => p.clone().applyMatrix4(gunState.inv);
const fromGun = p => p.clone().applyMatrix4(gunState.mat);

function closestOnSeg(p, a, b) {
  const ab = b.clone().sub(a), t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return a.clone().add(ab.multiplyScalar(t));
}
// Clearance of a sphere (p, r) against a collider list; < 0 means penetration.
function clearance(p, r, colliders) {
  let best = Infinity, n = null;
  for (const c of colliders) {
    if (c.type === 'gun') {
      const d = gunSDF(toGun(p)) * GUN_S - r;
      if (d < best) { best = d; n = c; }
    } else {
      const d = p.distanceTo(closestOnSeg(p, c.a, c.b)) - c.r - r;
      if (d < best) { best = d; n = c; }
    }
  }
  return { d: best, c: n };
}
function pushDir(p, c) {
  if (c.type === 'gun') {
    const g = toGun(p), e = 0.05;
    const n = V(gunSDF(V(g.x + e, g.y, g.z)) - gunSDF(V(g.x - e, g.y, g.z)),
                gunSDF(V(g.x, g.y + e, g.z)) - gunSDF(V(g.x, g.y - e, g.z)),
                gunSDF(V(g.x, g.y, g.z + e)) - gunSDF(V(g.x, g.y, g.z - e))).normalize();
    return n.applyQuaternion(gunState.q);
  }
  return p.clone().sub(closestOnSeg(p, c.a, c.b)).normalize();
}

// Finger skin radii (cm) for proximal / middle / distal phalanges.
// Measured from the mannequin mesh (median vertex distance to the bone line).
const FINGER_R = { thumb: [1.5, 1.3, 1.1], index: [1.15, 0.95, 0.88], middle: [1.15, 0.92, 0.85], ring: [1.1, 0.9, 0.82], pinky: [1.02, 0.85, 0.78] };
const FINGERS = ['index', 'middle', 'ring', 'pinky'];
const tipLocal = {};
function chainOf(f, s) { return [1, 2, 3].map(i => bones[`${f}_0${i}_${s}`]); }
function chainPoints(f, s) {
  const ch = chainOf(f, s);
  const pts = ch.map(worldPos);
  ch[2].updateWorldMatrix(true, false);
  pts.push(ch[2].localToWorld(tipLocal[`${f}_${s}`].clone()));
  return pts;
}
function fingerCapsules(f, s) {
  const p = chainPoints(f, s), r = FINGER_R[f];
  return [0, 1, 2].map(i => ({ type: 'cap', a: p[i], b: p[i + 1], r: r[i], name: `${f}_0${i + 1}_${s}` }));
}
// Minimum clearance of finger segments >= from against colliders (5 samples per segment).
function fingerClearance(f, s, from, colliders) {
  const p = chainPoints(f, s), r = FINGER_R[f];
  let min = Infinity, at = null, col = null;
  for (let i = from; i < 3; i++) for (let k = 0; k <= 4; k++) {
    const q = p[i].clone().lerp(p[i + 1], k / 4);
    const c = clearance(q, r[i], colliders);
    if (c.d < min) { min = c.d; at = q; col = c.c; }
  }
  return { d: min, p: at, c: col };
}

// Curl each joint (proximal first) until the finger touches something — the grip
// wraps the gun instead of using fixed angles, and never passes through it.
function curlUntilContact(f, s, axis, colliders, maxDeg = [95, 105, 80], step = 1) {
  const ch = chainOf(f, s), margin = 0.04;
  for (let i = 0; i < 3; i++) {
    let n = 0;
    while (fingerClearance(f, s, i, colliders).d < margin && n++ < 45) rotateWorld(ch[i], axis, -step * DEG);
    for (let a = 0; a < maxDeg[i]; a += step) {
      rotateWorld(ch[i], axis, step * DEG);
      if (fingerClearance(f, s, i, colliders).d < margin) { rotateWorld(ch[i], axis, -step * DEG); break; }
    }
  }
}
// CCD so the finger tip reaches a world target.
function ccdReach(f, s, target, iters = 24) {
  const ch = chainOf(f, s);
  for (let it = 0; it < iters; it++) for (let i = 2; i >= 0; i--) {
    const P = worldPos(ch[i]), tip = chainPoints(f, s)[3];
    const q = new THREE.Quaternion().setFromUnitVectors(tip.sub(P).normalize(), target.clone().sub(P).normalize());
    q.slerp(new THREE.Quaternion(), 0.35);
    setWorldQuat(ch[i], q.multiply(worldQuat(ch[i])));
  }
}
// Lay a thumb along a straight lane beside the frame (gun space), pointing along dir.
function layThumb(s, lane, dir) {
  const ch = chainOf('thumb', s), pts = chainPoints('thumb', s);
  const L = [0, 1, 2].map(i => pts[i].distanceTo(pts[i + 1]));
  const o = toGun(pts[0]);
  const q2 = lane.clone(); q2.z = o.z + 0.75 * L[0] / GUN_S;
  const D = dir.clone().normalize().applyQuaternion(gunState.q);
  const P2 = pts[0].clone().addScaledVector(fromGun(q2).sub(pts[0]).normalize(), L[0]);
  const P3 = P2.clone().addScaledVector(D, L[1]);
  aimAt(ch[0], ch[1], P2);
  aimAt(ch[1], ch[2], P3);
  ch[2].updateWorldMatrix(true, false);
  const tip = ch[2].localToWorld(tipLocal['thumb_' + s].clone());
  setWorldQuat(ch[2], new THREE.Quaternion().setFromUnitVectors(tip.sub(worldPos(ch[2])).normalize(), D).multiply(worldQuat(ch[2])));
}
// Rotate joints away from contact until the whole chain is clear.
function pushChainOut(f, s, colliders, iters = 60) {
  const ch = chainOf(f, s);
  for (let it = 0; it < iters; it++) {
    const c = fingerClearance(f, s, 0, colliders);
    if (c.d >= 0.04) return;
    const n = pushDir(c.p, c.c);
    for (let i = 2; i >= 0; i--) {
      const P = worldPos(ch[i]), arm = c.p.clone().sub(P);
      if (arm.length() < 0.3) continue;
      const axis = new THREE.Vector3().crossVectors(arm, n);
      if (axis.lengthSq() < 1e-6) continue;
      rotateWorld(ch[i], axis, 1.5 * DEG);
    }
  }
}
// Keep neighbouring fingers from interpenetrating by spreading them at the knuckle.
function separateNeighbours(s, palm, colliders, axis) {
  for (let k = 1; k < FINGERS.length; k++) {
    const prev = fingerCapsules(FINGERS[k - 1], s);
    const f = FINGERS[k];
    for (let n = 0; n < 12 && fingerClearance(f, s, 0, prev).d < -0.15; n++) {
      const dirAway = worldPos(bones[`${f}_01_${s}`]).sub(worldPos(bones[`${FINGERS[k - 1]}_01_${s}`])).normalize();
      const fwd = chainPoints(f, s)[3].sub(worldPos(bones[`${f}_01_${s}`]));
      const ax = new THREE.Vector3().crossVectors(fwd, dirAway).normalize();
      rotateWorld(bones[`${f}_01_${s}`], ax, 1.2 * DEG);
      curlUntilContact(f, s, axis, colliders, [0, 0, 0]);
    }
  }
}
function palmPoints(s) {
  const h = worldPos(bones['hand_' + s]), pts = [];
  for (const f of FINGERS) {
    const k = worldPos(bones[`${f}_01_${s}`]);
    pts.push(h.clone().lerp(k, 0.45), h.clone().lerp(k, 0.8));
  }
  return pts;
}
const PALM_R = 1.6;

// ======================================================================
//  HAND PLACEMENT relative to the pistol (gun-space targets)
// ======================================================================
const tilt = 20 * DEG, sup = 44 * DEG;
const HAND = {
  r: { fwd: V(-0.1, -Math.sin(tilt), Math.cos(tilt)), across: V(0, Math.cos(tilt), Math.sin(tilt)),
       socket: V(-2.45, -4.6, 3.1), pole: V(-0.7, -1, -0.2) },
  l: { fwd: V(0.12, -Math.sin(sup), Math.cos(sup)), across: V(0, Math.cos(sup), Math.sin(sup)),
       socket: V(3.4, -5.4, 4.3), pole: V(0.8, -1, -0.2) },
};
const handRel = {}, HAND_ERR = {};
function handFrame(s) {
  const fwd = worldPos(bones['middle_01_' + s]).sub(worldPos(bones['hand_' + s])).normalize();
  const acr = worldPos(bones['index_01_' + s]).sub(worldPos(bones['pinky_01_' + s])).normalize();
  const palm = s === 'r' ? new THREE.Vector3().crossVectors(acr, fwd) : new THREE.Vector3().crossVectors(fwd, acr);
  palm.normalize();
  return { fwd, acr, palm, curl: new THREE.Vector3().crossVectors(fwd, palm).normalize() };
}
// Place a hand so its middle knuckle lands on the socket, then push the palm out of contact.
function placeHandOnGun(s, colliders) {
  const cfg = HAND[s], gq = gunState.q;
  const fwdW = cfg.fwd.clone().applyQuaternion(gq), acrW = cfg.across.clone().applyQuaternion(gq);
  const socket = fromGun(cfg.socket);

//  GRIP SOLVE (once): hands to sockets, fingers by contact, thumbs, trigger finger
// ======================================================================
const report = {};
const trigFinger = { rest: null, pulled: null };
function solveGrip() {
  const gun = [{ type: 'gun' }];
  // Right (strong) hand
  placeHandOnGun('r', gun);
  let fr = handFrame('r');
  for (const f of ['middle', 'ring', 'pinky']) curlUntilContact(f, 'r', fr.curl, gun);
  separateNeighbours('r', fr.palm, gun, fr.curl);
  // Trigger finger: pad on the trigger face
  const trigRest = fromGun(V(-0.1, -2.05, 6.95));
  const piv = V(0, TRIGGER_PIVOT[1], TRIGGER_PIVOT[0]);
  const pulledG = V(-0.1, -2.05, 6.95).sub(piv).applyAxisAngle(V(1, 0, 0), TRIGGER_PULL).add(piv);
  ccdReach('index', 'r', trigRest);
  trigFinger.rest = chainOf('index', 'r').map(b => b.quaternion.clone());
  ccdReach('index', 'r', fromGun(pulledG));
  trigFinger.pulled = chainOf('index', 'r').map(b => b.quaternion.clone());
  chainOf('index', 'r').forEach((b, i) => b.quaternion.copy(trigFinger.rest[i]));

  // Left (support) hand wraps over the right hand's fingers
  const rightCaps = [...['middle', 'ring', 'pinky'].flatMap(f => fingerCapsules(f, 'r')),
    { type: 'cap', a: worldPos(bones.hand_r), b: worldPos(bones.middle_01_r), r: 1.6 },
    { type: 'cap', a: worldPos(bones.hand_r), b: worldPos(bones.pinky_01_r), r: 1.6 }];
  const leftCols = [...gun, ...rightCaps];
  placeHandOnGun('l', leftCols);
  const fl = handFrame('l');
  for (const f of FINGERS) curlUntilContact(f, 'l', fl.curl, leftCols);
  separateNeighbours('l', fl.palm, leftCols, fl.curl);

  // Thumbs forward: support thumb along the frame, strong thumb resting on it
  layThumb('l', V(2.75, -0.75, 0), V(0.03, -0.02, 1));
  pushChainOut('thumb', 'l', [...gun, ...rightCaps]);
  const leftThumb = fingerCapsules('thumb', 'l');
  layThumb('r', V(3.1, 1.1, 0), V(0.05, -0.12, 1));
  const leftHandCaps = FINGERS.flatMap(f => fingerCapsules(f, 'l'));
  pushChainOut('thumb', 'r', [...gun, ...leftThumb, ...leftHandCaps]);

  // Clearance report (cm, negative = penetration)
  const all = [...gun];
  for (const s of ['r', 'l']) for (const f of ['thumb', ...FINGERS]) {
    const others = [];
    for (const s2 of ['r', 'l']) for (const f2 of ['thumb', ...FINGERS])
      if (!(s2 === s && f2 === f) && !(s2 === s && Math.abs(['thumb', ...FINGERS].indexOf(f2) - ['thumb', ...FINGERS].indexOf(f)) > 1))
        others.push(...fingerCapsules(f2, s2));
    const vsGun = fingerClearance(f, s, 0, all).d;
    const vsFingers = fingerClearance(f, s, 0, others).d;
    report[`${f}_${s}`] = { gun: +vsGun.toFixed(2), fingers: +vsFingers.toFixed(2) };
  }
}

class Spring {
  constructor(hz, zeta) { this.w = 2 * Math.PI * hz; this.z = zeta; this.x = 0; this.v = 0; this.target = 0; }
  step(dt) {
    const n = Math.max(1, Math.ceil(dt / 0.001)), h = dt / n;
    for (let i = 0; i < n; i++) {
      this.v += (-this.w * this.w * (this.x - this.target) - 2 * this.z * this.w * this.v) * h;
      this.x += this.v * h;
    }
  }
  kick(peak) { // initial velocity that produces the requested first peak
    const s = Math.sqrt(1 - this.z * this.z);
    this.v += peak * this.w * Math.exp(this.z * Math.atan(s / this.z) / s);
  }
}

  yaw: new Spring(5.5, 0.5), roll: new Spring(5.5, 0.5),

    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime, out = actx.createDynamicsCompressor(); out.connect(actx.destination);
  const crack = actx.createBufferSource(); crack.buffer = noiseBuf; crack.playbackRate.value = rate;

  const g = actx.createGain(); g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45 / rate);
  crack.connect(lp).connect(g).connect(out); crack.start(t); crack.stop(t + 0.6 / rate);
  const osc = actx.createOscillator(), og = actx.createGain();
  osc.frequency.setValueAtTime(140 * rate, t); osc.frequency.exponentialRampToValueAtTime(40 * rate, t + 0.15 / rate);
  og.gain.setValueAtTime(0.9, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.2 / rate);
  osc.connect(og).connect(out); osc.start(t); osc.stop(t + 0.25 / rate);

function measureHand(obj) {
  let mesh; obj.traverse(n => { if (n.isSkinnedMesh) mesh = n; });
  const sk = mesh.skeleton, pos = mesh.geometry.attributes.position, si = mesh.geometry.attributes.skinIndex, sw = mesh.geometry.attributes.skinWeight;
  const bindPos = sk.boneInverses.map(m => new THREE.Vector3().setFromMatrixPosition(m.clone().invert()));
  const idx = n => sk.bones.findIndex(b => b.name === n);
  const out = {};

  for (const n of names) {
    const i = idx(n); const ds = [];
    const child = sk.bones[i].children.find(c => c.isBone);
    const a = bindPos[i], b = child ? bindPos[idx(child.name)] : null;
    for (let v = 0; v < pos.count; v++) {
      let best = 0, bi = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(v, k); if (w > best) { best = w; bi = si.getComponent(v, k); } }
      if (bi !== i) continue;

      ds.push(b ? p.distanceTo(closestOnSeg(p, a, b)) : p.distanceTo(a));
    }

    out[n] = { len: b ? +a.distanceTo(b).toFixed(2) : null, n: ds.length, r50: +(ds[ds.length >> 1] || 0).toFixed(2), r90: +(ds[Math.floor(ds.length * 0.9)] || 0).toFixed(2) };
  }

  document.title = 'MEASURE ' + JSON.stringify(out);
}

function slideOffset(t) {
  if (t < 0 || t > 0.06) return 0;
  if (t < 0.012) { const u = t / 0.012; return SLIDE_TRAVEL * (1 - (1 - u) * (1 - u)); }
  if (t < 0.016) return SLIDE_TRAVEL;
  if (t < 0.046) { const u = (t - 0.016) / 0.03; return SLIDE_TRAVEL * (1 - u * u); }
  return -0.12 * Math.sin(((t - 0.046) / 0.014) * Math.PI); // battery bounce
}
function triggerValue() {
  if (trigStart < 0) return 0;

  if (t < TRIG_PRESS + TRIG_HOLD) return 1;
  if (t < TRIG_PRESS + TRIG_HOLD + TRIG_RELEASE) return 1 - (t - TRIG_PRESS - TRIG_HOLD) / TRIG_RELEASE;

}

  for (const k of ['flip', 'back', 'up', 'yaw', 'roll']) rec[k].step(dt);
  rec.spine.target = 0.12 * rec.flip.x + 0.35 * rec.back.x;
  rec.shrug.target = 0.9 * rec.up.x;
  rec.head.target = -0.5 * rec.spine.x;
  rec.spine.step(dt); rec.shrug.step(dt); rec.head.step(dt);

  const breath = Math.sin(simTime * 1.6) * 0.35;
  const swayP = Math.sin(simTime * 0.9) * 0.12 + Math.sin(simTime * 2.3) * 0.05;
  const swayY = Math.sin(simTime * 0.7 + 1) * 0.15;

  for (const [b, q, p] of snapshot) { b.quaternion.copy(q); b.position.copy(p); }
  bones.pelvis.updateMatrixWorld(true);
  rotateWorld(bones.spine_02, X, -(0.45 * rec.spine.x + 0.3 * breath) * DEG);
  rotateWorld(bones.spine_03, X, -(0.55 * rec.spine.x + 0.2 * breath) * DEG);
  rotateWorld(bones.clavicle_r, Z, -rec.shrug.x * 1.2 * DEG);
  rotateWorld(bones.clavicle_l, Z, rec.shrug.x * 1.2 * DEG);
  rotateWorld(bones.head, X, rec.head.x * DEG);

  // Gun = base * translate(recoil) * rotate about wrist pivot
  const e = new THREE.Euler(-(rec.flip.x + swayP) * DEG, (rec.yaw.x + swayY) * DEG, rec.roll.x * DEG, 'YXZ');
  recM.makeTranslation(0, rec.up.x + 0.1 * breath, -rec.back.x)
    .multiply(tmpM.makeTranslation(RECOIL_PIVOT.x, RECOIL_PIVOT.y, RECOIL_PIVOT.z))
    .multiply(tmpM.makeRotationFromEuler(e))
    .multiply(tmpM.makeTranslation(-RECOIL_PIVOT.x, -RECOIL_PIVOT.y, -RECOIL_PIVOT.z));
  setGunMatrix(gunBase.clone().multiply(recM));
  pistol.gun.matrix.copy(gunState.mat);
  pistol.gun.matrixWorldNeedsUpdate = true;

  driveHand('r'); driveHand('l');

  const tv = triggerValue();
  pistol.trigPivot.rotation.x = tv * TRIGGER_PULL;
  chainOf('index', 'r').forEach((b, i) => b.quaternion.copy(trigFinger.rest[i]).slerp(trigFinger.pulled[i], tv));

  const st = simTime - fireTime;
  pistol.slide.position.z = -slideOffset(st);
  if (!ejected && st >= 0.01) { ejected = true; ejectShell(); }
  const fl = st >= 0 && st < 0.032;
  flash.visible = fl;
  if (fl) {
    const k = 1 - st / 0.032;
    flashLight.intensity = 30 * k;
    flashStar.material.opacity = k; flames.forEach(m => (m.material.opacity = k));
    flashStar.lookAt(camera.position);
  }
}
function updateFX(dt) {
  for (let i = smokes.length - 1; i >= 0; i--) {
    const s = smokes[i]; s.age += dt;
    const u = s.age / s.life;
    if (u >= 1) { scene.remove(s.sp); s.sp.material.dispose(); smokes.splice(i, 1); continue; }
    s.vel.multiplyScalar(Math.exp(-2.5 * dt)); s.vel.y += 12 * dt;
    s.sp.position.addScaledVector(s.vel, dt);
    s.sp.scale.setScalar(s.size * (1 + u * 4));
    s.sp.material.opacity = 0.45 * (1 - u) * Math.min(1, s.age * 20);
  }
  for (const s of shells) {
    if (s.rest) continue;
    s.v.y -= 981 * dt;
    s.m.position.addScaledVector(s.v, dt);
    const ang = s.w.length();
    if (ang > 0) s.m.quaternion.premultiply(tmpQ.setFromAxisAngle(s.w.clone().normalize(), ang * dt));
    if (s.m.position.y < GROUND_Y + 0.49) {
      s.m.position.y = GROUND_Y + 0.49;
      s.v.y = -s.v.y * 0.32; s.v.x *= 0.55; s.v.z *= 0.55; s.w.multiplyScalar(0.6);
      if (Math.abs(s.v.y) < 25) {
        s.v.y = 0; s.v.x *= 0.9; s.v.z *= 0.9;
        // lie on its side once it stops bouncing
        const axis = V(0, 1, 0).applyQuaternion(s.m.quaternion); axis.y = 0;
        if (s.v.length() < 5) { s.rest = true; s.m.quaternion.setFromUnitVectors(V(0, 1, 0), axis.lengthSq() > 1e-4 ? axis.normalize() : V(1, 0, 0)); }
      }
    }
  }
}

// ---------- views ----------
const views = {
  photo: [V(330, 165, -150), V(0, 90, 15)],
  front: [V(0, 120, 360), V(0, 92, 0)],
  back:  [V(0, 120, -360), V(0, 92, 0)],
  left:  [V(360, 120, 10), V(0, 92, 10)],
  right: [V(-360, 120, 10), V(0, 92, 10)],
  top:   [V(0.01, 420, 10), V(0, 60, 10)],
};
function setView(name) {
  const [pos, tgt] = views[name] || views.photo;
  camera.position.copy(pos); controls.target.copy(tgt); controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
const toggle = (id, fn) => document.getElementById(id).onclick = (e) => e.currentTarget.classList.toggle('active', fn());
toggle('spin', () => (controls.autoRotate = !controls.autoRotate));
toggle('auto', () => (autoFire = !autoFire));
toggle('slow', () => ((timeScale = timeScale < 1 ? 1 : 0.12), timeScale < 1));
toggle('sound', () => (soundOn = !soundOn));
toggle('colliders', () => { const on = !capsuleMeshes[0]?.visible; capsuleMeshes.forEach(m => (m.visible = on)); return on; });
document.getElementById('fire').onclick = pullTrigger;
document.getElementById('toggleRef').onclick = () => document.getElementById('ref').classList.toggle('hidden');
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pullTrigger(); } });
if (params.has('noref')) document.getElementById('ref').classList.add('hidden');
if (params.has('slow')) { timeScale = 0.12; document.getElementById('slow').classList.add('active'); }
// Test hook: ?t=seconds-after-shot freezes the frame at that moment of a shot.
const freezeAt = params.has('t') ? parseFloat(params.get('t')) : null;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
let frozenDone = false;
renderer.setAnimationLoop(() => {
  const real = Math.min(clock.getDelta(), 0.05);
  if (ready) {
    if (freezeAt !== null) {
      if (!frozenDone) { // deterministic: fire, then advance exactly freezeAt seconds
        frozenDone = true; soundOn = false; fire();
        for (let t = 0; t < freezeAt - 1e-9; t += 1 / 240) { simTime += 1 / 240; updateCharacter(1 / 240); updateFX(1 / 240); }
        updateCharacter(0);
      }
    } else {
      const dt = real * timeScale;
      simTime += dt;
      if (autoFire && simTime >= nextAuto) { pullTrigger(); nextAuto = simTime + 0.42; }
      updateCharacter(dt); updateFX(dt);
    }
  }
  controls.update(); renderer.render(scene, camera);
});
</script>
