<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const DEG = Math.PI / 180;
const params = new URLSearchParams(location.search);

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e23);
scene.fog = new THREE.Fog(0x1b1e23, 600, 1400);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 95, 10);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3f47, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(180, 380, 220);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 250, bottom: -100, near: 10, far: 1000 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fc3ff, 1.0);
rim.position.set(-250, 200, -250);
scene.add(rim);

const charRoot = new THREE.Group();   // world placement of the character; identity while solving
scene.add(charRoot);
scene.add(sun.target);
const GROUND_Y = 0;
const ground = new THREE.Mesh(new THREE.CircleGeometry(9000, 96),
  new THREE.MeshStandardMaterial({ color: 0x5d7a80, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(800, 40, 0x7f9aa0, 0x6a8890);
grid.position.y = 0.05;
grid.material.opacity = 0.35; grid.material.transparent = true;
scene.add(grid);

// ---------- bone helpers (all targets are in world space) ----------
const bones = {};
const restWorldQ = {};
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();

function worldPos(b) { b.updateWorldMatrix(true, false); return b.getWorldPosition(new THREE.Vector3()); }
function worldQuat(b) { b.updateWorldMatrix(true, false); return b.getWorldQuaternion(new THREE.Quaternion()); }
function setWorldQuat(b, q) {
  const parentQ = worldQuat(b.parent);
  b.quaternion.copy(parentQ.invert().multiply(q));
  b.updateMatrixWorld(true);
}
function rotateWorld(b, axis, angle) {
  setWorldQuat(b, _q.setFromAxisAngle(axis.clone().normalize(), angle).multiply(worldQuat(b)));
}
// Orient a bone from rest so (child - bone) points along dir and refRest maps toward refTarget.
function orient(b, child, dir, refRest, refTarget) {
  setWorldQuat(b, restWorldQ[b.name].clone());
  const cur = worldPos(child).sub(worldPos(b)).normalize();
  const m1 = basis(cur, refRest), m2 = basis(dir.clone().normalize(), refTarget);
  const rot = new THREE.Quaternion().setFromRotationMatrix(m2.multiply(m1.transpose()));
  setWorldQuat(b, rot.multiply(worldQuat(b)));
}
function basis(a, ref) {
  const x = a.clone().normalize();
  const z = new THREE.Vector3().crossVectors(x, ref).normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  return new THREE.Matrix4().makeBasis(x, y, z);
}
function aimAt(b, child, target) {
  const cur = worldPos(child).sub(worldPos(b)).normalize();
  const want = target.clone().sub(worldPos(b)).normalize();
  setWorldQuat(b, _q2.setFromUnitVectors(cur, want).multiply(worldQuat(b)));
}
function twoBoneIK(root, mid, end, target, pole) {
  const a = worldPos(mid).distanceTo(worldPos(root));
  const c = worldPos(end).distanceTo(worldPos(mid));
  const R = worldPos(root);
  const toT = target.clone().sub(R);
  const d = Math.min(toT.length(), (a + c) * 0.999);
  const dir = toT.normalize();
  const cosA = (a * a + d * d - c * c) / (2 * a * d);
  const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
  const perp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const elbow = R.clone().add(dir.clone().multiplyScalar(a * cosA)).add(perp.multiplyScalar(a * sinA));
  aimAt(root, mid, elbow);
  aimAt(mid, end, R.clone().add(dir.multiplyScalar(d)));
}

// ======================================================================
//  PISTOL — one side profile drives both the mesh and the collision SDF
//  Gun space: +Z muzzle, +Y up, +X = gun's left side, units cm.
// ======================================================================
const FRAME_OUT = [[-1.0, 0.5], [15.0, 0.5], [15.0, -0.9], [8.7, -0.9], [8.45, -2.8], [7.75, -3.45], [4.6, -3.45],
  [3.55, -3.0], [0.47, -11.46], [0.65, -11.5], [0.5, -12.05], [-4.55, -10.2], [-4.5, -9.62], [-4.32, -9.72],
  [-1.62, -2.3], [-2.45, -1.15], [-2.35, -0.35], [-1.6, 0.3]];
const FRAME_HOLE = [[4.85, -0.9], [8.05, -0.9], [7.85, -2.45], [7.35, -2.95], [4.75, -2.95], [4.2, -2.3]];
const TRIGGER = [[6.0, -0.9], [6.4, -0.9], [6.25, -1.7], [5.95, -2.55], [5.55, -2.55], [5.75, -1.7]];
const TRIGGER_PIVOT = [6.2, -0.9];
const TRIGGER_PULL = 18 * DEG;
const SLIDE_OUT = [[-2.0, 0.5], [16.4, 0.5], [16.4, 2.9], [15.9, 3.3], [-1.6, 3.3], [-2.0, 2.9]];
const FRAME_HW = 1.45, SLIDE_HW = 1.27, BEVEL = 0.2;
const MUZZLE = V(0, 1.9, 16.45), EJECT_PORT = V(-0.7, 3.2, 5.6);
const SLIDE_TRAVEL = 4.2;
const GUN_S = 1.15;   // the UE mannequin's hands are ~15% larger than a real hand

function sdPoly(px, py, pts) {
  let d = (px - pts[0][0]) ** 2 + (py - pts[0][1]) ** 2, s = 1;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const ex = pts[j][0] - pts[i][0], ey = pts[j][1] - pts[i][1];
    const wx = px - pts[i][0], wy = py - pts[i][1];
    const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
    const bx = wx - ex * t, by = wy - ey * t;
    d = Math.min(d, bx * bx + by * by);
    const c1 = py >= pts[i][1], c2 = py < pts[j][1], c3 = ex * wy > ey * wx;
    if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
  }
  return s * Math.sqrt(d);
}
function sdExtrude(d2, x, hw) {
  const wx = d2, wy = Math.abs(x) - hw;
  return Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx, 0), Math.max(wy, 0));
}
// Signed distance (cm) from a gun-space point to the pistol surface.
function gunSDF(p) {
  const frame = sdExtrude(Math.max(sdPoly(p.z, p.y, FRAME_OUT), -sdPoly(p.z, p.y, FRAME_HOLE)) - BEVEL, p.x, FRAME_HW);
  const slide = sdExtrude(sdPoly(p.z, p.y, SLIDE_OUT) - BEVEL, p.x, SLIDE_HW);
  const trig = sdExtrude(sdPoly(p.z, p.y, TRIGGER), p.x, 0.35);
  return Math.min(frame, slide, trig);
}

function extrudeSide(outline, holes, width, bevel, mat) {
  const s = new THREE.Shape(outline.map(([z, y]) => new THREE.Vector2(z, y)));
  (holes || []).forEach(h => s.holes.push(new THREE.Path(h.map(([z, y]) => new THREE.Vector2(z, y)))));
  const depth = width - 2 * bevel;
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 4 });
  g.rotateY(-Math.PI / 2); g.translate(depth / 2, 0, 0);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; return m;
}

function makePistol() {
  const polymer = new THREE.MeshStandardMaterial({ color: 0x202226, roughness: 0.78, metalness: 0.0 });
  const steel = new THREE.MeshStandardMaterial({ color: 0x2b2d31, roughness: 0.32, metalness: 0.85 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x0a0a0b, roughness: 0.6, metalness: 0.3 });
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x55585c, roughness: 0.25, metalness: 1.0 });

  const gun = new THREE.Group();
  gun.matrixAutoUpdate = false;
  gun.add(extrudeSide(FRAME_OUT, [FRAME_HOLE], FRAME_HW * 2, BEVEL, polymer));
  // grip texture panels
  for (const sx of [-1, 1]) {
    const p = box(0.05, 5.2, 3.6, dark, sx * (FRAME_HW + 0.01), -6.6, -0.7);
    p.rotation.x = 20 * DEG; gun.add(p);
  }
  // slide + details (moves as a unit)
  const slide = new THREE.Group();
  slide.add(extrudeSide(SLIDE_OUT, null, SLIDE_HW * 2, BEVEL, steel));
  slide.add(box(0.5, 0.55, 0.6, steel, 0, 3.55, 15.2));               // front sight
  slide.add(box(2.0, 0.6, 0.7, steel, 0, 3.58, -0.9));                // rear sight
  slide.add(box(0.5, 0.1, 0.1, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, 3.8, 15.5));
  for (let i = 0; i < 8; i++) for (const sx of [-1, 1])                 // rear serrations
    slide.add(box(0.06, 2.2, 0.18, dark, sx * (SLIDE_HW + 0.02), 1.95, -1.3 + i * 0.42));
  slide.add(box(1.5, 0.08, 3.6, dark, -0.35, 3.31, 5.6));             // ejection port
  slide.add(box(1.2, 0.1, 3.2, barrelMat, -0.35, 3.24, 5.6));          // barrel hood
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.1, 20), dark);
  crown.rotation.x = Math.PI / 2; crown.position.set(0, 1.9, 16.62); slide.add(crown);
  gun.add(slide);
  // trigger on its pivot
  const trigPivot = new THREE.Group();
  trigPivot.position.set(0, TRIGGER_PIVOT[1], TRIGGER_PIVOT[0]);
  const trig = extrudeSide(TRIGGER, null, 0.7, 0.08, polymer);
  trig.position.set(0, -TRIGGER_PIVOT[1], -TRIGGER_PIVOT[0]);
  trigPivot.add(trig); gun.add(trigPivot);
  gun.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { gun, slide, trigPivot };
}

// ======================================================================
//  RIFLE  M4-style carbine.  Rifle space: +Z muzzle, +Y up, bore on the Z axis, cm.
// ======================================================================
const R_LOWER = [[-7, -0.8], [15, -0.8], [15, -6.8], [6.4, -6.8], [6.4, -4.4], [-7, -4.4]];
const R_GRIP = [[-0.4, -4.4], [-4.2, -4.4], [-7.6, -13.8], [-6.8, -14.6], [-3.0, -14.6], [-0.2, -6.2]];
const R_MAG = [[6.6, -6.8], [14.8, -6.8], [15.6, -12], [17.4, -17], [19.6, -21.6], [19.2, -23], [11.4, -23.2], [9.4, -18.4], [7.8, -13]];
const R_STOCK = [[-12, 2.4], [-27, 2.6], [-34, 3.4], [-35.4, 3.0], [-35.4, -12.5], [-33.6, -13.2], [-30.6, -8], [-25, -4], [-13, -2.4]];
const R_TRIGGER = [[1.6, -4.4], [2.1, -4.4], [2.0, -5.4], [1.6, -6.6], [1.2, -6.6], [1.5, -5.4]];
const RTRIG_PIVOT = [1.9, -4.4];
const RIFLE_MUZZLE = V(0, 0, 73.2), RIFLE_EJECT = V(-1.8, 0.9, 6);
const RIFLE_R_SOCK = V(-2.8, -8.0, -0.9);   // right middle knuckle on the pistol grip's front-right
const RIFLE_L_SOCK = V(-1.0, -3.8, 30);     // left middle knuckle under the handguard (fingers wrap up the right side)
// Hand frames in rifle space: wrist->middle-knuckle direction and index->pinky axis.
const RIFLE_R_HAND = [V(-0.1, -Math.sin(20 * DEG), Math.cos(20 * DEG)), V(0, Math.cos(20 * DEG), Math.sin(20 * DEG))];
const RIFLE_L_HAND = [V(-0.85, 0.35, 0.25), V(0, 0, 1)];
function makeRifle() {
  const blk = new THREE.MeshStandardMaterial({ color: 0x1d1e21, roughness: 0.55, metalness: 0.35 });
  const poly = new THREE.MeshStandardMaterial({ color: 0x18191b, roughness: 0.85, metalness: 0.0 });
  const metal = new THREE.MeshStandardMaterial({ color: 0x2c2e32, roughness: 0.3, metalness: 0.9 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.7 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1b2a3a, roughness: 0.05, metalness: 0.9, emissive: 0x060c14 });
  const g = new THREE.Group(); g.matrixAutoUpdate = false;
  const cyl = (r1, r2, len, mat, x, y, z, seg = 20) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, seg), mat);
    m.rotation.x = Math.PI / 2; m.position.set(x, y, z); m.castShadow = true; return m;
  };
  g.add(box(2.6, 3.4, 22, blk, 0, 0.9, 4));                       // upper receiver
  g.add(box(2.1, 0.9, 52, blk, 0, 3.05, 20));                     // top rail
  for (let i = 0; i < 50; i++) g.add(box(2.3, 0.35, 0.5, blk, 0, 3.6, -5.5 + i * 1.04));
  g.add(extrudeSide(R_LOWER, null, 2.4, 0.15, blk));
  g.add(extrudeSide(R_GRIP, null, 2.8, 0.3, poly));
  g.add(extrudeSide(R_MAG, null, 2.3, 0.2, poly));
  g.add(extrudeSide(R_STOCK, null, 3.6, 0.4, poly));
  g.add(box(0.9, 0.5, 7.6, blk, 0, -7.6, 2.6));                   // trigger guard
  g.add(cyl(1.5, 1.5, 22, blk, 0, 0.4, -18));                     // buffer tube
  g.add(box(4.6, 5.0, 32, blk, 0, 0.4, 31));                      // handguard
  for (let i = 0; i < 6; i++) for (const sx of [-1, 1]) g.add(box(0.1, 1.2, 3.2, dark, sx * 2.32, 0.4, 19 + i * 5));

// ======================================================================
//  GAIT  procedural walk / run cycle.  Pose vector (character space, +Z fwd, +X left):

// ---------- input ----------
const keys = new Set();
let demoOn = false, testInput = null;
const DEMO = [[1.5, {}], [3.5, { z: 1 }], [4.5, { z: 1, run: 1, turn: 0.45 }], [1.0, {}], [3.0, { x: 1 }], [2.5, { z: -1 }], [3.0, { z: 1, turn: -0.5 }], [1.5, {}]];
function demoInput(t) {
  const total = DEMO.reduce((a, d) => a + d[0], 0); t %= total;
  for (const [d, v] of DEMO) { if (t < d) return { x: 0, z: 0, run: 0, turn: 0, ...v }; t -= d; }
  return { x: 0, z: 0, run: 0, turn: 0 };
}
function readInput(dt) {
  if (testInput) return testInput;
  if (demoOn) { mm.demoT += dt; return demoInput(mm.demoT); }
  const k = (...c) => c.some(x => keys.has(x)) ? 1 : 0;
  return { x: k('KeyA') - k('KeyD'), z: k('KeyW', 'ArrowUp') - k('KeyS', 'ArrowDown'),
    run: k('ShiftLeft', 'ShiftRight'), turn: game.active ? 0 : 1.5 * (k('KeyQ', 'ArrowLeft') - k('KeyE', 'ArrowRight')) };
}

function stepLocomotion(dt) {
  const inp = readInput(dt);
  let des = [0, 0];
  const m = Math.hypot(inp.x, inp.z);
  if (m > 0.01) {
    const dx = inp.x / m, dz = inp.z / m;
    let sp = inp.run ? (dz > 0.35 ? RUN_SPEED : 190) : WALK_SPEED;
    if (dz < -0.35) sp = Math.min(sp, 130);

  if (el <= st) { mm.vel[0] = des[0]; mm.vel[1] = des[1]; } else { mm.vel[0] += ex / el * st; mm.vel[1] += ez / el * st; }
  mm.speed = Math.hypot(mm.vel[0], mm.vel[1]);
  const dTurn = game.active ? angWrap(tps.yaw - charYaw) * (1 - Math.exp(-10 * dt)) : inp.turn * dt;
  charYaw += dTurn;

  tvAuto += ((triggerHeld ? 1 : 0) - tvAuto) * Math.min(1, dt * 45);
  if (triggerHeld && tvAuto > 0.7 && simTime >= nextShot && W.swapT < 0) { fire(); nextShot = simTime + 60 / W.cur.rpm; }

}

function slideOffset(t) {

function updateGameCamera(real) {

  const p = tps.pitch + rec.cam.x * DEG;
  const fwd = V(Math.sin(tps.yaw) * Math.cos(p), Math.sin(p), Math.cos(tps.yaw) * Math.cos(p));
  const right = V(-Math.cos(tps.yaw), 0, Math.sin(tps.yaw));
  const pivot = charPos.clone().add(V(0, 150 + 4 * tps.z, 0)).addScaledVector(right, lerp(42, 30, tps.z));
  camera.position.copy(pivot).addScaledVector(fwd, -lerp(140, 75, tps.z));
  camera.lookAt(camera.position.clone().add(fwd));
  const fov = lerp(50, 30, tps.z);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  ray.set(camera.position, fwd); ray.far = 9000;
  const hit = ray.intersectObjects(hittables, false)[0];

  aim.point.copy(hit && hit.distance < tg ? hit.point : camera.position.clone().addScaledVector(fwd, Math.min(tg, 5000)));

  if (ikEdit.on) toggleIKEdit(false);
  game.active = true; game.state = 'ready';
  document.body.classList.add('gaming'); document.getElementById('hud').classList.remove('hidden');
  TGROUP.visible = true; controls.enabled = false; controls.autoRotate = false; demoOn = false;
  charPos.set(0, 0, 0); charYaw = 0; lastPlaced.set(0, 0, 0); tps.yaw = 0; tps.pitch = -0.04;
  scene.fog.near = 2500; scene.fog.far = 9000;
  showOverlay('Aim trainer', '60 seconds. Hit the steel plates and knock down the poppers.\nFarther plates score more, popper headshots +50.\nTip: press 2 for the rifle (hold to fire full-auto).', 'Start');
}
function exitGame() {
  game.active = false; game.state = 'off'; releaseFire(); document.exitPointerLock?.();
  document.body.classList.remove('gaming'); document.getElementById('hud').classList.add('hidden');
  TGROUP.visible = false; controls.enabled = true; tps.zoom = false;
  scene.fog.near = 600; scene.fog.far = 1400; camera.fov = 40; camera.updateProjectionMatrix();
  setView('photo');
}
document.getElementById('ovGo').onclick = () => {
  lockPointer();
  if (game.state === 'paused') { game.state = 'play'; document.getElementById('ov').classList.add('hidden'); } else startRound();
};
document.getElementById('ovExit').onclick = exitGame;
function pauseGame() {
  if (game.state !== 'play') return;
  game.state = 'paused'; releaseFire();
  showOverlay('Paused', 'Click Resume to continue.', 'Resume');
}
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && game.active) pauseGame(); });
addEventListener('mousemove', e => {
  if (!game.active || game.state !== 'play') return;
  const k = 0.0022 * lerp(1, 0.6, tps.z);
  tps.yaw -= e.movementX * k;
  tps.pitch = clamp(tps.pitch - e.movementY * k, -0.75, 0.6);
});
addEventListener('mousedown', e => {
  if (!game.active || game.state !== 'play') return;
  if (e.button === 0) pressFire(); if (e.button === 2) tps.zoom = true;
});
addEventListener('mouseup', e => { if (e.button === 0) releaseFire(); if (e.button === 2) tps.zoom = false; });
addEventListener('contextmenu', e => { if (game.active) e.preventDefault(); });

// ---------- views ----------
const views = {
  photo: [V(-250, 150, -290), V(0, 92, 20)],
  front: [V(0, 120, 360), V(0, 92, 0)],
  back:  [V(0, 120, -360), V(0, 92, 0)],
  left:  [V(360, 120, 10), V(0, 92, 10)],
  right: [V(-360, 120, 10), V(0, 92, 10)],
  top:   [V(0.01, 420, 10), V(0, 60, 10)],
};
function setView(name) {
  const [pos, tgt] = views[name] || views.photo;
  camera.position.copy(pos).add(charPos); controls.target.copy(tgt).add(charPos); controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
const toggle = (id, fn) => document.getElementById(id).onclick = (e) => e.currentTarget.classList.toggle('active', fn());
toggle('spin', () => (controls.autoRotate = !controls.autoRotate));
toggle('auto', () => (autoFire = !autoFire));
toggle('slow', () => ((timeScale = timeScale < 1 ? 1 : 0.12), timeScale < 1));
toggle('sound', () => (soundOn = !soundOn));
toggle('demo', () => { demoOn = !demoOn; mm.demoT = 0; return demoOn; });
toggle('ikdbg', () => (ikDbg.visible = !ikDbg.visible));
toggle('colliders', () => { const on = !capsuleMeshes[0]?.visible; capsuleMeshes.forEach(m => (m.visible = on)); return on; });
document.getElementById('fire').onclick = () => { if (W.cur.auto) { pressFire(); setTimeout(releaseFire, 70); } else pullTrigger(); };
document.getElementById('weap').onclick = () => switchWeapon(W.cur.name === 'rifle' ? 'pistol' : 'rifle');
document.getElementById('ikedit').onclick = () => toggleIKEdit();
document.getElementById('game').onclick = enterGame;
document.getElementById('toggleRef').onclick = () => document.getElementById('ref').classList.toggle('hidden');
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pressFire(); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Digit1') switchWeapon('pistol');
  if (e.code === 'Digit2') switchWeapon('rifle');
  if (ikEdit.on && e.code === 'KeyT') setIKMode('translate');
  if (ikEdit.on && e.code === 'KeyR') setIKMode('rotate');
  if (e.code === 'Escape' && game.active) pauseGame();
  keys.add(e.code);
});
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Space') releaseFire(); });
addEventListener('blur', () => keys.clear());
if (params.has('noref')) document.getElementById('ref').classList.add('hidden');
if (params.has('slow')) { timeScale = 0.12; document.getElementById('slow').classList.add('active'); }
// Test hook: ?t=seconds-after-shot freezes the frame at that moment of a shot.
const freezeAt = params.has('t') ? parseFloat(params.get('t')) : null;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
let frozenDone = false, initDone = false, simFrozen = false, statusT = 0;
const step60 = 1 / 60;
function inputFromParams() {
  const mv = (params.get('move') || '0,0').split(',').map(Number);
  return { x: mv[0] || 0, z: mv[1] || 0, run: params.has('run') ? 1 : 0, turn: parseFloat(params.get('turn') || '0') };
}
// ?sim=seconds&move=x,z[&run][&turn=rad/s] : run the locomotion for N seconds, then freeze for a screenshot.
function aimAtTarget(i) {
  const t = targets[i]; t.g.updateMatrixWorld(true);
  const c = t.mesh.getWorldPosition(V(0, 0, 0)).add(V(0, t.kind === 'popper' ? 40 : 0, 0));
  for (let k = 0; k < 4; k++) {
    updateGameCamera(0);
    const d = c.clone().sub(camera.position);
    tps.yaw = Math.atan2(d.x, d.z); tps.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
  }
  updateGameCamera(0); aim.smooth.copy(aim.point);
}
function runSim() {
  testInput = inputFromParams(); soundOn = false;
  if (params.has('game')) { enterGame(); startRound(); }
  const T = parseFloat(params.get('sim')), shots = parseInt(params.get('shoot') || '0');
  let fired = 0, nextT = 1.0;
  for (let t = 0; t < T; t += step60) {
    if (params.has('aimt')) aimAtTarget(+params.get('aimt'));
    if (params.has('swap') && Math.abs(t - 0.5) < step60 / 2) switchWeapon(params.get('swap'));
    if (fired < shots && t >= nextT) { pressFire(); fired++; nextT = t + 0.45; }
    if (W.cur.auto && t >= nextT - 0.45 + 0.1) releaseFire();
    simTime += step60; updateCharacter(step60); updateFX(step60); updateTargets(step60);
    if (game.active) { updateGameCamera(step60); updateGame(step60); }
  }
  if (params.has('freezeFlash')) { fire(); updateCharacter(0.012); }
  simFrozen = true;
  if (params.has('debug')) document.title = 'SIM ' + JSON.stringify({ weapon: W.cur.name, blend: W.blend, score: game.score, hits: game.hits, shots: game.shots, clip: mm.clips[mm.clip].name, v: mm.vel });
}
// ?test : scripted locomotion scenarios with foot-contact / popping metrics written into the page title.
function runTest() {
  soundOn = false;
  const seq = {
    walk: t => ({ x: 0, z: 1 }), run: t => ({ x: 0, z: 1, run: 1 }), strafe: t => ({ x: 1, z: 0 }), back: t => ({ x: 0, z: -1 }),
    circle: t => ({ x: 0, z: 1, run: 1, turn: 0.7 }),
    stopgo: t => t < 1 ? {} : t < 4 ? { z: 1 } : t < 6 ? {} : t < 9 ? { z: 1, run: 1 } : t < 11 ? {} : { z: 1 },
  };
  const out = {};
  for (const [name, f] of Object.entries(seq)) {
    turnOff.forEach(t => t.fill(0)); Object.assign(mm, { clip: 0, phase: 0, vel: [0, 0], speed: 0, transitions: 0, searchT: 0 }); charYaw = 0; charPos.set(0, 0, 0); lastPlaced.set(0, 0, 0);
    mm.out.set(IDLE); mm.prev.set(IDLE); mm.outVel.fill(0); mm.inertX.fill(0); mm.inertV.fill(0);
    const T = name === 'stopgo' ? 13 : 6, prev = {}, slide = [], jump = [], minY = [], pel = [];
    let reach = 0, worst = {};
    for (let t = 0; t < T; t += step60) {
      testInput = { x: 0, z: 0, run: 0, turn: 0, ...f(t) };
      simTime += step60; updateCharacter(step60);
      reach = Math.max(reach, ikState.reachFix);
      pel.push(worldPos(bones.pelvis).y);
      for (const s of ['l', 'r']) {
        const w = worldPos(bones['foot_' + s]);
        if (prev[s]) {
          const dxz = Math.hypot(w.x - prev[s].x, w.z - prev[s].z) / step60;
          jump.push(Math.abs(w.y - prev[s].y) / step60 + dxz * 0);
          if (t > 1.5 && w.y < ANKLE_H + 0.8 && prev[s].y < ANKLE_H + 0.8) { slide.push(dxz); if (dxz > (worst.v || 0)) worst = { v: +dxz.toFixed(0), t: +t.toFixed(2), s, clip: mm.clips[mm.clip].name, sp: +mm.speed.toFixed(0) }; }
        }
        minY.push(w.y); prev[s] = w;
      }
    }
    slide.sort((a, b) => a - b);
    out[name] = { v: +mm.speed.toFixed(0), n: slide.length, slideMed: +(slide[slide.length >> 1] || 0).toFixed(1), slideP95: +(slide[Math.floor(slide.length * 0.95)] || 0).toFixed(1),
      slideMax: +(slide[slide.length - 1] || 0).toFixed(1), footVyMax: +Math.max(...jump).toFixed(0), minFootY: +Math.min(...minY).toFixed(2),
      pelvis: [+Math.min(...pel).toFixed(1), +Math.max(...pel).toFixed(1)], reachFixMax: +reach.toFixed(2), trans: mm.transitions, worst };
  }
  out.ankleH = +ANKLE_H.toFixed(2); out.legMax = +LEG_MAX.toFixed(1); out.hip = +HIP_HALF.toFixed(1); out.db = mm.db.n;
  document.title = 'TEST ' + JSON.stringify(out);
}
renderer.setAnimationLoop(() => {
  const real = Math.min(clock.getDelta(), 0.05);
  if (ready && !initDone) { initDone = true; if (params.has('test')) runTest(); else if (params.has('sim')) runSim(); }
  if (ready && !simFrozen && !params.has('test')) {
    if (freezeAt !== null) {
      if (!frozenDone) { // deterministic: fire, then advance exactly freezeAt seconds
        frozenDone = true; soundOn = false; fire();
        for (let t = 0; t < freezeAt - 1e-9; t += 1 / 240) { simTime += 1 / 240; updateCharacter(1 / 240); updateFX(1 / 240); }
        updateCharacter(0);
      }
    } else {
      const dt = real * timeScale;
      simTime += dt;
      if (autoFire && simTime >= nextAuto) { pullTrigger(); nextAuto = simTime + 0.42; }
      if (!(game.active && game.state !== 'play')) { updateCharacter(dt); updateFX(dt); updateTargets(dt); }
      if (game.active) updateGame(real);
      statusT -= real;
      if (statusT <= 0 && !demoOn === !demoOn) {
        statusT = 0.15;
        document.getElementById('status').textContent = `${W.cur.name} · ${mm.clips[mm.clip].name} · ${mm.speed.toFixed(0)} cm/s · MM cost ${mm.cost.toFixed(2)} → ${mm.best.toFixed(2)} · ${mm.transitions} transitions · WASD / Shift / Q E / Space`;
      }
    }
  }
  if (game.active) updateGameCamera(real); else controls.update();
  renderer.render(scene, camera);
});
</script>
